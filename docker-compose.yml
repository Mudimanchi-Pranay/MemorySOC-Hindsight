services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: memorysoc-hindsight
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY}
      HINDSIGHT_API_WORKER_ID: memorysoc-dev
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
